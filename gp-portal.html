.pend-row input { position: absolute; opacity: 0; width: 0; height: 0; }
.pend-box { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); background: #fff; display: grid; place-items: center; color: #fff; margin-top: 1px; transition: background .15s, border-color .15s; }
.pend-box svg { width: 13px; height: 13px; opacity: 0; transition: opacity .15s; }
.pend-row input:checked ~ .pend-box { background: var(--success); border-color: var(--success); }

.pend-row input:focus-visible ~ .pend-box { outline: 3px solid #F2B84B; outline-offset: 2px; }
.pend-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pend-title { font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.4; }
.pend-row.done .pend-title { color: var(--ink-3); text-decoration: line-through; }
.pend-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pend-wk { font-size: 10.5px; font-weight: 700; color: var(--primary-2); background: var(--primary-soft); border-radius: 5px; padding: 1px 7px; }

.pend-who { font-size: 11.5px; color: var(--ink-3); }
.pend-row .status { flex: none; align-self: flex-start; }

    title: S("Research ethics and personal data (§6.3)", "أخلاقيات البحث والبيانات الشخصية (§6.3)"),
    text: S("Surveys, interviews and user tests require informed consent; participation is voluntary and anonymous wherever possible. Personal data is collected only when necessary, stored securely and handled in line with the Personal Data Protection Law (PDPL). Data from an organisation requires its written approval; public datasets are used according to their licence and cited. Studies involving human participants beyond anonymous surveys require the approval of the university's research ethics committee before data collection.",
      "تتطلب الاستبانات والمقابلات واختبارات المستخدمين موافقة مستنيرة، وتكون المشاركة طوعية ومجهولة الهوية ما أمكن. لا تُجمع البيانات الشخصية إلا عند الضرورة، وتُحفظ بشكل آمن، وتُعالج وفق نظام حماية البيانات الشخصية. يتطلب استخدام بيانات أي جهة موافقتها الكتابية، وتُستخدم مجموعات البيانات العامة وفق تراخيصها مع توثيقها. وتتطلب الدراسات التي تشمل مشاركين من البشر بما يتجاوز الاستبانات مجهولة الهوية موافقة لجنة أخلاقيات البحث في الجامعة قبل جمع البيانات.")
  },
  cyber: {
    title: S("Ethical conduct in cybersecurity and network projects (§6.4)", "السلوك الأخلاقي في مشاريع الأمن السيبراني والشبكات (§6.4)"),
    motto: S("Authorised, isolated and documented", "مصرّح به ومعزول وموثّق"),
    text: S("Security testing is carried out only in isolated lab or virtual environments, or on systems for which written authorisation has been obtained. Scanning, attacking or intercepting traffic on real networks, including the university network, is prohibited. Malware samples and offensive tools are used only inside a sandbox with the supervisor's approval. Any vulnerability found in a real system is reported responsibly through the supervisor and never disclosed publicly. All work complies with the Anti-Cyber Crime Law and the regulations of the National Cybersecurity Authority.",
      "لا تُجرى الاختبارات الأمنية إلا في بيئات مختبرية أو افتراضية معزولة، أو على أنظمة حصل الفريق على تصريح كتابي بشأنها. يُمنع فحص الشبكات الحقيقية أو مهاجمتها أو اعتراض حركة البيانات فيها، بما في ذلك شبكة الجامعة. ولا تُستخدم عينات البرمجيات الخبيثة والأدوات الهجومية إلا داخل بيئة معزولة وبموافقة المشرف. وتُبلَّغ أي ثغرة تُكتشف في نظام حقيقي بمسؤولية عبر المشرف ولا يُفصح عنها علناً. ويلتزم العمل كله بنظام مكافحة الجرائم المعلوماتية وتنظيمات الهيئة الوطنية للأمن السيبراني.")
  },
  ip: {
    title: S("Intellectual property and confidentiality (§6.5)", "الملكية الفكرية والسرية (§6.5)"),
    text: S("Intellectual property arising from projects is governed by the university's intellectual property regulations. Sponsored projects may be subject to a separate agreement approved before work starts. Teams respect the licences of any open-source components they use. Unless the Committee has agreed a confidentiality restriction, the Department may showcase projects, and students may include their projects in personal portfolios.",
      "تخضع الملكية الفكرية الناتجة عن المشاريع للائحة الملكية الفكرية في الجامعة، وقد تخضع المشاريع المرعية لاتفاق مستقل يُعتمد قبل بدء العمل. ويلتزم الفريق بتراخيص المكوّنات مفتوحة المصدر. وما لم تقر اللجنة قيداً على السرية، يحق للقسم عرض المشاريع، ويحق للطلاب إدراجها في ملفات إنجازهم الشخصية.")
  },
  misconduct: {
    title: S("Consequences of misconduct (§6.6)", "عواقب المخالفات (§6.6)"),
    text: S("Confirmed plagiarism, fabrication, prohibited AI use or unauthorised security testing may lead to a zero mark for the component, failure in the course, and referral under the university's student discipline regulations.", "قد يترتب على ثبوت الانتحال أو الاختلاق أو الاستخدام الممنوع للذكاء الاصطناعي أو الاختبار الأمني غير المصرّح به رصدُ درجة الصفر للمكوّن، أو الرسوب في المقرر، والإحالة وفق لائحة تأديب الطلاب.")
  }
};

DATA.faq = [
  { id: "f1", cat: "registration", q: S("How many students are in a team?", "كم عدد أعضاء الفريق؟"), a: S("Teams normally have five to six students; any other size requires Committee approval.", "يتكوّن الفريق عادةً من خمسة إلى ستة طلاب، ويتطلب أي عدد آخر موافقة اللجنة."), ref: "§3.5" },
  { id: "f2", cat: "registration", q: S("How do we register our team and choose a topic?", "كيف نسجّل فريقنا ونختار موضوعاً؟"), a: S("The Committee announces the list of available topics and the call for student proposals. Teams submit the Group Discussion Form (GP-Form 02) in Week 1 with members, student IDs, GPAs, three ranked topic choices and the team's skills. The Committee allocates topics and supervisors, taking into account preferences, skills, balance between teams and supervision load; each team meets its supervisor within the same week.", "تعلن اللجنة قائمة الموضوعات المتاحة ودعوة الطلاب لتقديم مقترحاتهم. يسلّم الفريق نموذج مناقشة المجموعة (GP-Form 02) في الأسبوع الأول متضمناً الأعضاء وأرقامهم الجامعية ومعدلاتهم وثلاثة خيارات مرتبة للموضوع ومهارات الفريق. وتوزّع اللجنة الموضوعات والمشرفين مراعيةً الرغبات والمهارات والتوازن والعبء الإشرافي، ويلتقي كل فريق بمشرفه في الأسبوع نفسه."), ref: "§4.2" },
  { id: "f3", cat: "registration", q: S("Where do project topics come from? Can we propose our own?", "من أين تأتي موضوعات المشاريع؟ وهل يمكننا اقتراح موضوعنا؟"), a: S("Four sources: faculty-proposed topics published by the Committee; student-proposed topics submitted with a short concept note and a willing supervisor; sponsored topics from government or private entities approved by the Committee; and continuation topics that extend a previous project with a clearly new contribution. Topics should address a real need and, where possible, relate to national priorities such as digital transformation, cybersecurity, data and AI.", "أربعة مصادر: موضوعات يقترحها أعضاء هيئة التدريس وتعلنها اللجنة؛ وموضوعات يقترحها الطلاب مرفقة بورقة فكرة مختصرة وموافقة مشرف؛ وموضوعات برعاية جهات حكومية أو خاصة تعتمدها اللجنة؛ وموضوعات امتداد تطوّر مشروعاً سابقاً بإضافة جديدة واضحة. وينبغي أن تعالج الموضوعات حاجة حقيقية وترتبط ما أمكن بالأولويات الوطنية كالتحول الرقمي والأمن السيبراني والبيانات والذكاء الاصطناعي."), ref: "§4.1" },
  { id: "f4", cat: "registration", q: S("Which delivery model applies to my course?", "ما نموذج التقديم الذي ينطبق على مقرري؟"), a: S("Model A (Bachelor): NET496 → NET499 and CYB496 → CYB499 over two consecutive semesters. Model B (Diploma, two courses): CT 1455 → CT 1555 over two consecutive levels. Model C (Diploma, single course): COMP 3510, WEBT/GRAT 3510 and CYS 2410 cover the full life cycle in one semester. Every course belongs to exactly one model.", "النموذج (أ) للبكالوريوس: NET496 ← NET499 وCYB496 ← CYB499 في فصلين متتاليين. النموذج (ب) للدبلوم بمقررين: CT 1455 ← CT 1555 في مستويين متتاليين. النموذج (ج) للدبلوم بمقرر واحد: COMP 3510 وWEBT/GRAT 3510 وCYS 2410 تغطي دورة الحياة كاملة في فصل واحد. وينتمي كل مقرر إلى نموذج واحد فقط."), ref: "§2.1" },
  { id: "f5", cat: "proposal", q: S("When is the proposal due and what must it contain?", "متى يُسلَّم المقترح وماذا يتضمن؟"), a: S("The Project Proposal (GP-Form 03) is submitted no later than one week after allocation (Week 2 in the timelines; it must be approved by Week 3 at the latest in the single-course model). It must include: title, problem statement and motivation; aim and measurable objectives; scope, assumptions and constraints; a brief literature review of at least five sources; methodology and project stages; a 12-week Gantt chart; tasks assigned to each member; expected results and deliverables; resources, tools and data; ethical, legal and data-privacy considerations; and the signatures of the supervisor and all members.", "يُسلَّم مقترح المشروع (GP-Form 03) في موعد أقصاه أسبوع من التوزيع (الأسبوع الثاني في الجداول الزمنية، ويُعتمد في موعد أقصاه الأسبوع الثالث في نموذج المقرر الواحد). ويتضمن: العنوان وبيان المشكلة ودوافعها؛ والهدف العام والأهداف القابلة للقياس؛ والنطاق والافتراضات والقيود؛ ومراجعة أدبيات مختصرة من خمسة مصادر على الأقل؛ والمنهجية ومراحل المشروع؛ ومخطط جانت لاثني عشر أسبوعاً؛ والمهام المسندة لكل عضو؛ والنتائج والمخرجات المتوقعة؛ والموارد والأدوات والبيانات؛ والاعتبارات الأخلاقية والنظامية وخصوصية البيانات؛ وتوقيع المشرف وجميع الأعضاء."), ref: "§4.3 · §2.4" },
  { id: "f6", cat: "proposal", q: S("What can the Committee decide about our proposal?", "ما القرارات الممكنة للجنة بشأن مقترحنا؟"), a: S("Approved, approved with modifications, or resubmit within one week. The proposal is the team's contract with the Committee.", "الاعتماد، أو الاعتماد مع تعديلات، أو إعادة التقديم خلال أسبوع. والمقترح هو عقد الفريق مع اللجنة."), ref: "§4.3" },
  { id: "f7", cat: "proposal", q: S("Our topic turned out to be infeasible. What now?", "تبيّن أن موضوعنا غير قابل للتنفيذ. ماذا نفعل؟"), a: S("Submit a Change Request (GP-Form 10) by Week 4 (Week 3 in Model C). The Committee decides.", "قدّموا طلب تغيير (GP-Form 10) بحلول الأسبوع الرابع (الأسبوع الثالث في النموذج ج)، واللجنة هي صاحبة القرار."), ref: "§4.8" },
  { id: "f8", cat: "supervisor", q: S("How often do we meet our supervisor, and what is recorded?", "كم مرة نلتقي المشرف، وما الذي يُسجَّل؟"), a: S("The 45 contact hours are delivered as a scheduled weekly supervision meeting of three hours. Attendance, progress and agreed actions are recorded in the Weekly Meeting Log (GP-Form 04), signed by the supervisor; each member reports on their own tasks at every meeting. Online meetings may replace face-to-face meetings with the supervisor's agreement and are recorded in the same log.", "تُقدَّم ساعات الاتصال الخمس والأربعون في صورة اجتماع إشرافي أسبوعي مجدول مدته ثلاث ساعات. يُسجَّل الحضور والتقدم والإجراءات المتفق عليها في سجل الاجتماعات الأسبوعية (GP-Form 04) بتوقيع المشرف، ويعرض كل عضو ما أنجزه في كل اجتماع. ويجوز عقد الاجتماعات عن بُعد بموافقة المشرف وتُسجَّل في السجل نفسه."), ref: "§4.7" },
  { id: "f9", cat: "supervisor", q: S("When are progress reports due?", "متى تُسلَّم تقارير التقدم؟"), a: S("Teams submit a Progress Report (GP-Form 05) in Weeks 6 and 10. By Week 6 the supervisor flags any team or member at risk to the Coordinator so that support can be arranged early.", "يسلّم الفريق تقرير التقدم (GP-Form 05) في الأسبوعين 6 و10. ويبلّغ المشرف المنسقَ بحلول الأسبوع السادس عن أي فريق أو عضو متعثر حتى يُرتَّب الدعم مبكراً."), ref: "§4.7" },
  { id: "f10", cat: "supervisor", q: S("How quickly should the supervisor give feedback?", "ما المدة المتوقعة لتغذية المشرف الراجعة؟"), a: S("The supervisor provides timely written feedback on submitted work, normally within one week.", "يقدّم المشرف تغذية راجعة مكتوبة في الوقت المناسب على الأعمال المسلّمة، خلال أسبوع عادةً."), ref: "§3.3" },
  { id: "f11", cat: "supervisor", q: S("A member is not contributing. What happens?", "أحد الأعضاء لا يُسهم في العمل. ماذا يحدث؟"), a: S("The supervisor documents evidence, holds a meeting and issues a written warning; if unresolved, the case goes to the Coordinator. Grades are differentiated: based on the meeting log, repository history, peer assessment and defence answers, the Committee may adjust an individual's share of a group component by up to ±20%, and a member with no documented contribution may receive a failing grade even if the team passes.", "يوثّق المشرف الأدلة ويعقد اجتماعاً ويوجّه إنذاراً كتابياً، وإن لم تُحل المشكلة تُرفع إلى المنسق. وتُميَّز الدرجات: فبناءً على سجل الاجتماعات وسجل المستودع وتقييم الأقران وإجابات المناقشة يجوز للّجنة تعديل نصيب العضو من المكوّن الجماعي بما لا يتجاوز ±20%، ويجوز رصد درجة رسوب للعضو الذي لا يثبت له إسهام موثّق ولو اجتاز الفريق."), ref: "§4.8 · §7.4" },
  { id: "f12", cat: "supervisor", q: S("What if our supervisor becomes unavailable?", "ماذا لو تعذّر وجود مشرفنا؟"), a: S("The Coordinator assigns an interim or replacement supervisor.", "يكلّف المنسق مشرفاً مؤقتاً أو بديلاً."), ref: "§4.8" },
  { id: "f13", cat: "evaluation", q: S("How is the course mark made up?", "كيف تتكوّن درجة المقرر؟"), a: S("Two approved instruments carry the full 100 marks: the Supervisor's Assessment Sheet (GP-Form 06), 60 marks — documentation 20 (team), workflow mechanism 30 (individual), presentation delivery 5 and answering questions 5 (individual) — and the Examiner's Assessment Sheet (GP-Form 07), 40 marks — documentation 20 (team), delivery 10 (team), answering questions 10 (individual). Course total: 50 marks team-wide + 50 marks individual.", "أداتان معتمدتان تشكلان الدرجة الكاملة (100): بطاقة تقييم المشرف (GP-Form 06) بـ60 درجة — التوثيق 20 (جماعي)، وآلية سير العمل 30 (فردي)، وأداء العرض 5 والإجابة عن الأسئلة 5 (فردي) — وبطاقة تقييم المقيّم (GP-Form 07) بـ40 درجة — التوثيق 20 (جماعي)، والأداء 10 (جماعي)، والإجابة عن الأسئلة 10 (فردي). المجموع: 50 درجة جماعية + 50 درجة فردية."), ref: "§7.2 · Table 7.1" },
  { id: "f14", cat: "evaluation", q: S("Which version of the assessment sheet applies to my course?", "ما نسخة بطاقة التقييم المطبَّقة على مقرري؟"), a: S("Version A in Project (1) — NET496, CYB496 and CT 1455 — where the project is still at the analysis and design stage. Version B in Project (2) — NET499, CYB499, CT 1555 — and in the single-course model — COMP 3510, WEBT/GRAT 3510, CYS 2410 — where results and implementation are assessed.", "النسخة (أ) في مشروع (1) — NET496 وCYB496 وCT 1455 — حيث يكون المشروع في مرحلة التحليل والتصميم. والنسخة (ب) في مشروع (2) — NET499 وCYB499 وCT 1555 — وفي نموذج المقرر الواحد — COMP 3510 وWEBT/GRAT 3510 وCYS 2410 — حيث تُقيَّم النتائج والتنفيذ."), ref: "§7.2.2 · Table 7.2" },
  { id: "f15", cat: "evaluation", q: S("How are the 1–5 ratings turned into marks?", "كيف تُحوَّل التقديرات من 1 إلى 5 إلى درجات؟"), a: S("Add the ratings given to the criteria of a part, then multiply the total by the factor for that part (Table 7.15): for example supervisor documentation ×0.333 (Version A) or ×0.400 (Version B); workflow ×0.667 (A) or ×1.000 (B); examiner documentation ×0.333 (A) or ×0.364 (B); examiner delivery ×0.400 (A) or ×0.500 (B); answering questions ×1.000 on the supervisor's sheet and ×2.000 on the examiner's sheet. Keep one decimal place at every step and round only the final course mark.", "تُجمع تقديرات معايير الجزء ثم يُضرب المجموع في معامل ذلك الجزء (الجدول 7.15): مثلاً توثيق المشرف ×0.333 (النسخة أ) أو ×0.400 (النسخة ب)؛ وآلية سير العمل ×0.667 (أ) أو ×1.000 (ب)؛ وتوثيق المقيّم ×0.333 (أ) أو ×0.364 (ب)؛ وأداء العرض عند المقيّم ×0.400 (أ) أو ×0.500 (ب)؛ والإجابة عن الأسئلة ×1.000 في بطاقة المشرف و×2.000 في بطاقة المقيّم. ويُحتفظ بمنزلة عشرية واحدة في كل خطوة ولا يُقرَّب إلا مجموع المقرر النهائي."), ref: "§7.7.5" },
  { id: "f16", cat: "evaluation", q: S("What is the 'workflow mechanism' and how is it graded?", "ما «آلية سير العمل» وكيف تُقدَّر؟"), a: S("It is the supervisor-only part worth 30 marks — the only part rated for each student separately across the whole semester. It is rated from the meeting log, the progress reports and the supervisor's direct observation, not from the final report: nine criteria in Project (1) and six in Project (2)/single course (interaction, attendance and punctuality, dependability, quality of work, use of modern tools, finishing on time, and in Project (1) also attitude, ability to learn new things and presenting in a group setting).", "هو الجزء الخاص بالمشرف بواقع 30 درجة — والجزء الوحيد الذي يُقدَّر لكل طالب على حدة على امتداد الفصل. ويُقدَّر من سجل الاجتماعات وتقارير التقدم وملاحظة المشرف المباشرة لا من التقرير النهائي: تسعة معايير في مشروع (1) وستة في مشروع (2)/المقرر الواحد (التعامل مع الأعضاء، والحضور والالتزام بالمواعيد، والاعتماد عليه، وجودة العمل، واستخدام الأدوات الحديثة، وإنجاز المهام في وقتها، وفي مشروع (1) أيضاً السلوك وتعلم أشياء جديدة والعرض في بيئة جماعية)."), ref: "§7.7.3 · Table 7.13" },
  { id: "f17", cat: "evaluation", q: S("Who are the examiners, and does the supervisor grade the defence?", "من المقيّمون، وهل يقيّم المشرف المناقشة؟"), a: S("Each project is examined by an examination committee formed by the Graduation Projects Committee — normally two examiners who are not supervising the project, one of whom chairs; the supervisor attends. Each examiner completes an independent sheet and the examiner mark is the arithmetic mean of their sheets. The supervisor does not complete an examiner's sheet and does not take part in agreeing the examiners' marks, but grades the presentation parts of the supervisor's sheet (5 + 5 marks).", "تُقيِّم كل مشروع لجنة تقييم تشكّلها لجنة مشاريع التخرج — وتضم عادةً مقيّمَين من غير المشرفين يرأس أحدهما الجلسة، ويحضرها المشرف. يعبّئ كل مقيّم بطاقة مستقلة ودرجة المقيّمين هي المتوسط الحسابي لبطاقاتهم. ولا يعبّئ المشرف بطاقة مقيّم ولا يشارك في الاتفاق على درجاتهم، لكنه يقدّر جزأي العرض في بطاقة المشرف (5 + 5 درجات)."), ref: "§3.6 · §7.3" },
  { id: "f18", cat: "evaluation", q: S("What happens if we submit late?", "ماذا يحدث عند التأخر في التسليم؟"), a: S("10% of the component's mark is deducted per calendar day for up to three days; after that the work is not accepted unless an excuse is approved by the Committee.", "يُحسم 10% من درجة المكوّن عن كل يوم تأخير بحد أقصى ثلاثة أيام، ولا يُقبل العمل بعدها إلا بعذر تعتمده اللجنة."), ref: "§4.8" },
  { id: "f19", cat: "evaluation", q: S("Can we see the examiners' comments or appeal?", "هل يمكننا الاطلاع على ملاحظات المقيّمين أو التظلم؟"), a: S("Students may read the written comments once results are approved, and may appeal under the university regulations.", "للطلاب الاطلاع على الملاحظات المكتوبة بعد اعتماد النتائج، ولهم التظلم وفق أنظمة الجامعة."), ref: "§7.9" },
  { id: "f20", cat: "presentation", q: S("How long is the defence and what is its format?", "ما مدة المناقشة وهيكلها؟"), a: S("Project (1): presentation 10–15 minutes, questions 10, deliberation 5 (no demo). Project (2) and single course: presentation 10, live demonstration 10, questions 5, deliberation 5. The chair opens the session; the team presents, then demonstrates the solution where required; examiners ask questions — each member receives at least two individual questions; the team leaves while examiners deliberate; the chair announces the preliminary outcome and any corrections.", "مشروع (1): عرض 10–15 دقيقة، وأسئلة 10، ومداولة 5 (بلا عرض عملي). مشروع (2) والمقرر الواحد: عرض 10، وعرض عملي 10، وأسئلة 5، ومداولة 5. يفتتح الرئيس الجلسة؛ ويقدّم الفريق عرضه ثم يستعرض الحل عملياً عند الحاجة؛ ويطرح المقيّمون أسئلتهم — سؤالان فرديان على الأقل لكل عضو؛ ويغادر الفريق أثناء المداولة؛ ثم يُبلغ الرئيس الفريق بالنتيجة الأولية وأي تعديلات."), ref: "Table 7.6 · §8.5" },
  { id: "f21", cat: "presentation", q: S("What are the rules for the slides?", "ما قواعد الشرائح؟"), a: S("16:9 format, 10–15 slides, text of at least 20 pt, and the department template (T-02). Every member presents a part and answers questions individually. Bring a recorded backup of the demo, arrive 15 minutes early and test the equipment.", "مقاس 16:9، ومن 10 إلى 15 شريحة، وخط لا يقل عن 20 نقطة، وقالب القسم (T-02). ويعرض كل عضو جزءاً ويجيب عن الأسئلة فردياً. أحضروا تسجيلاً احتياطياً للعرض العملي، واحضروا قبل 15 دقيقة لاختبار الأجهزة."), ref: "§7.5" },
  { id: "f22", cat: "presentation", q: S("What if a member misses the defence?", "ماذا لو تغيّب عضو عن المناقشة؟"), a: S("A student who does not attend the defence receives no mark for the presentation parts of either sheet.", "لا تُرصد للطالب المتغيب عن المناقشة أي درجة في جزأي العرض من البطاقتين."), ref: "§7.3" },
  { id: "f23", cat: "poster", q: S("When is Project Day and what do we bring?", "متى يُقام يوم المشاريع وماذا نُحضر؟"), a: S("Week 13. Every team presents an A1 portrait poster (594 × 841 mm) on the department template with title, team and supervisor, problem, objectives, method or architecture, results, conclusion, and a QR code to the demo video or repository. Each team gives a three-minute pitch and answers the panel's questions.", "الأسبوع الثالث عشر. يعرض كل فريق ملصقاً بمقاس A1 رأسي (594 × 841 ملم) وفق قالب القسم يتضمن العنوان والفريق والمشرف والمشكلة والأهداف والمنهجية أو البنية والنتائج والخاتمة ورمز QR يحيل إلى فيديو العرض أو المستودع. ويقدّم كل فريق عرضاً موجزاً مدته ثلاث دقائق ويجيب عن أسئلة اللجنة."), ref: "§7.6" },
  { id: "f24", cat: "poster", q: S("How is the poster graded?", "كيف يُقيَّم الملصق؟"), a: S("The Project Day panel assesses the poster with the poster rubric (§7.6); its marks are 'per specification' and are fed through the workflow mechanism as approved by the Committee. The guide does not publish a weighted poster rubric, so the exact marks need confirmation from the Committee.", "تقيّم لجنة يوم المشاريع الملصق وفق معايير تقييم الملصق (§7.6)؛ ودرجته «حسب التوصيف» وتُغذَّى عبر آلية سير العمل بما تقرّه اللجنة. ولا ينشر الدليل معايير موزونة للملصق، فالدرجة الدقيقة بحاجة إلى تأكيد من اللجنة."), ref: "Tables 7.7 · 7.8" },
  { id: "f25", cat: "final", q: S("How long should the report be, and in what language?", "ما طول التقرير وبأي لغة يُكتب؟"), a: S("Main body: 30–50 pages for Project (1), 50–80 for Project (2), 40–70 for a single-course project (excluding front matter, references and appendices). Reports are written in English unless the Committee approves Arabic for a diploma project. Body text: Times New Roman 12 pt (English) or Sakkal Majalla 16 pt (Arabic), 1.5 spacing, A4.", "المتن: 30–50 صفحة لمشروع (1)، و50–80 لمشروع (2)، و40–70 لمشروع المقرر الواحد (بدون الصفحات التمهيدية والمراجع والملاحق). تُكتب التقارير بالإنجليزية ما لم تعتمد اللجنة العربية لمشروع الدبلوم. النص الأساسي: Times New Roman 12 (إنجليزي) أو Sakkal Majalla 16 (عربي)، بتباعد 1.5 على ورق A4."), ref: "§5.7" },
  { id: "f26", cat: "final", q: S("Which referencing style and how many references?", "ما نمط التوثيق وكم عدد المراجع؟"), a: S("IEEE (numbered) is the department style; APA 7th may be used with the supervisor's approval, and one style is used consistently. Minimum references: 10 for diploma reports and 15 for bachelor reports, most from the last five years and including peer-reviewed sources.", "النمط المعتمد IEEE (الترقيمي)، ويجوز APA الإصدار السابع بموافقة المشرف مع الالتزام بنمط واحد. الحد الأدنى للمراجع: 10 لتقارير الدبلوم و15 لتقارير البكالوريوس، معظمها من السنوات الخمس الأخيرة ومن بينها مصادر محكّمة."), ref: "§5.8" },
  { id: "f27", cat: "final", q: S("How and where do we submit the final work?", "كيف وأين نسلّم العمل النهائي؟"), a: S("The final report is submitted on the LMS by the published deadline as PDF and Word, with the similarity report. Code, configuration and simulation files, design files and datasets (with licences) are submitted as a release or archive; the final version is tagged in the private Git repository shared with the supervisor since Week 1, and the README explains how to install, configure and run the solution. No passwords, keys or personal data are stored in the repository.", "يُسلَّم التقرير النهائي عبر نظام إدارة التعلم في الموعد المعلن بصيغتي PDF وWord مع تقرير التشابه. وتُسلَّم الشيفرة وملفات الإعدادات والمحاكاة والتصميم ومجموعات البيانات (مع تراخيصها) في صورة إصدار أو ملف مضغوط، ويُوسَم الإصدار النهائي في مستودع Git الخاص المشترك مع المشرف منذ الأسبوع الأول، ويوضح ملف README طريقة التثبيت والإعداد والتشغيل. ولا تُخزَّن في المستودع كلمات مرور أو مفاتيح أو بيانات شخصية."), ref: "§5.9" },
  { id: "f28", cat: "final", q: S("What are the possible outcomes after the defence?", "ما القرارات الممكنة بعد المناقشة؟"), a: S("Accepted (grade recorded after the final copy is submitted); accepted with minor corrections (within one week, verified by the supervisor); accepted with major corrections (within two weeks, verified by the supervisor and one examiner); or not accepted (the course is failed and repeated under university regulations). Final grades are released only after GP-Form 09 is signed by the supervisor and the Coordinator.", "مقبول (تُرصد الدرجة بعد تسليم النسخة النهائية)؛ أو مقبول مع تعديلات طفيفة (خلال أسبوع بتحقق المشرف)؛ أو مقبول مع تعديلات جوهرية (خلال أسبوعين بتحقق المشرف وأحد المقيّمين)؛ أو غير مقبول (رسوب في المقرر وإعادته وفق لوائح الجامعة). ولا تُرصد الدرجات النهائية إلا بعد توقيع المشرف والمنسق على النموذج GP-Form 09."), ref: "§7.8" },
  { id: "f29", cat: "final", q: S("What must the Project (2) report include beyond the Project (1) report?", "ما الذي يجب أن يتضمنه تقرير مشروع (2) زيادةً على تقرير مشروع (1)؟"), a: S("The Project (2) report builds on the Project (1) report and must include a table showing how each Project (1) examiner comment was addressed; it updates the Project (1) chapters and adds implementation, testing and evaluation, results and discussion.", "يُبنى تقرير مشروع (2) على تقرير مشروع (1) ويجب أن يتضمن جدولاً يبيّن كيفية معالجة كل ملاحظة من ملاحظات لجنة تقييم مشروع (1)؛ ويحدّث فصول مشروع (1) ويضيف التنفيذ والاختبار والتقييم والنتائج والمناقشة."), ref: "§2.5 · §5.3" },
  { id: "f30", cat: "integrity", q: S("What similarity percentage is allowed?", "ما نسبة التشابه المسموح بها؟"), a: S("The overall similarity index, excluding the reference list and properly quoted text, must not exceed 20%, and no single source may exceed 5%. A report above these limits is returned and not examined until revised.", "يجب ألا تتجاوز نسبة التشابه الإجمالية 20% بعد استبعاد قائمة المراجع والاقتباسات الموثقة، وألا يتجاوز أي مصدر منفرد 5%. ويُعاد التقرير الذي يتجاوز هذه الحدود ولا يُقيَّم إلا بعد تعديله."), ref: "§6.1" },
  { id: "f31", cat: "integrity", q: S("Can we use ChatGPT or other AI tools?", "هل يمكننا استخدام ChatGPT أو أدوات ذكاء اصطناعي أخرى؟"), a: S("Yes, with disclosure, for brainstorming, explaining concepts and error messages, language editing of text the team wrote, coding assistance the team reviews, tests and can explain, clearly labelled synthetic test data, and finding sources the team then reads. Prohibited: submitting AI text as your own analysis, unverified or invented references, presenting AI-generated data as measured, uploading sponsor or personal data to public AI services, using AI during the defence, and submitting code you cannot explain. Every report includes the mandatory AI-use statement (Appendix C.2).", "نعم، مع الإفصاح: للعصف الذهني، وشرح المفاهيم ورسائل الأخطاء، والتدقيق اللغوي لنص كتبه الفريق، والمساعدة البرمجية التي يراجعها الفريق ويختبرها ويستطيع شرحها، وبيانات الاختبار الاصطناعية المصرَّح بها، والبحث عن مصادر يقرؤها الفريق. ويُمنع: تقديم نص مولَّد آلياً على أنه تحليلكم، والمراجع غير المتحقق منها أو المختلقة، وعرض بيانات مولَّدة على أنها مقيسة، ورفع بيانات الجهة الراعية أو البيانات الشخصية إلى خدمات عامة، واستخدام الأدوات أثناء المناقشة، وتسليم شيفرة لا تستطيعون شرحها. ويتضمن كل تقرير بيان استخدام الذكاء الاصطناعي الإلزامي (الملحق ج-2)."), ref: "§6.2" },
  { id: "f32", cat: "integrity", q: S("Can we test security tools on the university network?", "هل يمكننا اختبار الأدوات الأمنية على شبكة الجامعة؟"), a: S("No. Security testing is carried out only in isolated lab or virtual environments, or on systems with written authorisation. Scanning, attacking or intercepting traffic on real networks, including the university network, is prohibited; malware and offensive tools are used only in a sandbox with the supervisor's approval; any real vulnerability is reported responsibly through the supervisor.", "لا. لا تُجرى الاختبارات الأمنية إلا في بيئات مختبرية أو افتراضية معزولة أو على أنظمة بتصريح كتابي. ويُمنع فحص الشبكات الحقيقية أو مهاجمتها أو اعتراض حركتها بما فيها شبكة الجامعة؛ ولا تُستخدم البرمجيات الخبيثة والأدوات الهجومية إلا في بيئة معزولة بموافقة المشرف؛ وتُبلَّغ أي ثغرة حقيقية بمسؤولية عبر المشرف."), ref: "§6.4" },
  { id: "f33", cat: "committee", q: S("Can we change our topic, team or supervisor between Project (1) and (2)?", "هل يمكن تغيير الموضوع أو الفريق أو المشرف بين مشروع (1) و(2)؟"), a: S("The same team continues the same project, normally with the same supervisor, in the semester immediately following Project (1). Any change of topic, team membership or supervisor requires a Change Request (GP-Form 10) approved by the Committee. A student who does not pass Project (1) may not register Project (2).", "يواصل الفريق نفسه المشروع نفسه، ومع المشرف نفسه عادةً، في الفصل التالي مباشرة لمشروع (1). ويتطلب أي تغيير في الموضوع أو الأعضاء أو المشرف طلب تغيير (GP-Form 10) تعتمده اللجنة. ولا يحق لمن لم يجتز مشروع (1) التسجيل في مشروع (2)."), ref: "§2.5" },
  { id: "f34", cat: "committee", q: S("Who publishes the exact dates?", "من يعلن التواريخ الدقيقة؟"), a: S("The Committee publishes the annual calendar of deadlines, Project Day and defence weeks; exact dates are published in the Committee calendar each semester. The Coordinator manages the LMS course pages, announcements, templates and submission links.", "تعلن اللجنة التقويم السنوي للمواعيد النهائية ويوم المشاريع وأسابيع المناقشات، وتُعلَن التواريخ الدقيقة في تقويم اللجنة كل فصل. ويدير المنسق صفحات المقررات في نظام إدارة التعلم والإعلانات والقوالب وروابط التسليم."), ref: "§3.1 · §3.2" },
  { id: "f35", cat: "committee", q: S("What if the guide and my course specification disagree?", "ماذا لو اختلف الدليل عن توصيف مقرري؟"), a: S("The course specification prevails for learning outcomes and assessment weights; university regulations prevail over both. The Committee interprets the guide and decides on cases it does not cover.", "يُعمل بتوصيف المقرر فيما يخص نواتج التعلم وأوزان التقييم، وتتقدم لوائح الجامعة عليهما معاً. وتتولى اللجنة تفسير الدليل والبت فيما لم يرد فيه نص."), ref: "§1.4" }
];

  { id: "x2", area: S("Prerequisites", "المتطلبات السابقة"), issue: S("CYB496 requires completion of 90 credit hours in the catalogue (Table 6) but the course profile (G.3) lists no prerequisite.", "يشترط المقرر CYB496 إتمام 90 ساعة في دليل المقررات (الجدول 6) بينما لا تذكر بطاقة المقرر (ز-3) أي متطلب سابق."), ref: "Table 6 · G.3" },

/* References: Arabic "الفصل X" / "الفصلان X و Y" / "الفصول …"; English "Section X" / "Sections X and Y". */
function fmtRef(ref) {
  if (!ref) return "";
  const parts = String(ref).split("·").map(s => s.trim()).filter(Boolean);
  const nums = []; const others = [];
  parts.forEach(p => { const m = p.match(/^§\s*([\d.]+)$/); if (m) nums.push(m[1]); else others.push(p.replace(/^§\s*/, isAr() ? "الفصل " : "Section ")); });
  let out = "";
  if (isAr()) {
    if (nums.length === 1) out = `الفصل ${nums[0]}`;
    else if (nums.length === 2) out = `الفصلان ${nums[0]} و${nums[1]}`;
    else if (nums.length > 2) out = `الفصول ${nums.slice(0, -1).join(" و")} و${nums[nums.length - 1]}`;
  } else {
    if (nums.length === 1) out = `Section ${nums[0]}`;
    else if (nums.length === 2) out = `Sections ${nums[0]} and ${nums[1]}`;
    else if (nums.length > 2) out = `Sections ${nums.slice(0, -1).join(", ")} and ${nums[nums.length - 1]}`;
  }
  return [out, ...others].filter(Boolean).join(" · ");
}

function parseHash() {
  const h = (location.hash || "#/home").replace(/^#\/?/, "");
  const [path, q] = h.split("?");
  const parts = path.split("/").filter(Boolean);
  const view = VIEWS.includes(parts[0]) ? parts[0] : "home";
  const query = {}; (q || "").split("&").forEach(kv => { if (!kv) return; const [k, v] = kv.split("="); query[decodeURIComponent(k)] = decodeURIComponent(v || ""); });
  return { view, params: parts.slice(1), query };
}

function setHashQuiet(hash) { history.replaceState(null, "", hash); }

function selectorHtml(opts = {}) {
  const c = courseById(state.courseId);
  const level = c ? c.level : state.selLevel;
  const prog = c ? c.programme : state.selProg;
  const progs = DATA.programmes.filter(p => !level || p.level === level);
  const courses = DATA.courses.filter(x => (!prog || x.programme === prog) && (!level || x.level === level));

  return `<div class="selector ${opts.cls || ""}">
    <div class="field"><label for="sel-level">${esc(U("level"))}</label><select id="sel-level" class="select" data-sel="level">${opt("", U("chooseLevel"), !level)}${DATA.levels.map(l => opt(l.id, T(l.name), level === l.id)).join("")}</select></div>
    <div class="field"><label for="sel-prog">${esc(U("programme"))}</label><select id="sel-prog" class="select" data-sel="prog">${opt("", U("chooseProgramme"), !prog)}${progs.map(p => opt(p.id, T(p.name), prog === p.id)).join("")}</select></div>
    <div class="field"><label for="sel-course">${esc(U("course"))}</label><select id="sel-course" class="select" data-sel="course">${opt("", U("chooseCourse"), !c)}${courses.map(x => opt(x.id, `${x.code} — ${T(x.title)}`, c && c.id === x.id)).join("")}</select></div>

}
function onSelectorChange(kind, value) {
  if (kind === "level") { state.selLevel = value; state.selProg = ""; state.courseId = ""; }
  if (kind === "prog") { state.selProg = value; const p = DATA.programmes.find(x => x.id === value); if (p) state.selLevel = p.level; state.courseId = (p && p.courseIds.length === 1) ? p.courseIds[0] : ""; }

}

function runSearch(q) {
  const box = $("#results"); q = (q || "").trim().toLowerCase();
  if (!INDEX) INDEX = buildIndex();
  if (q.length < 2) { box.innerHTML = `<div class="empty">${esc(U("searchPlaceholder"))}</div>`; return; }
  const terms = q.split(/\s+/).filter(Boolean);
  const scored = INDEX.map(it => { let s = 0; const tl = it.title.toLowerCase(); terms.forEach(t => { if (tl.includes(t)) s += 3; else if (it.text.includes(t)) s += 1; }); return [s, it]; }).filter(x => x[0] >= terms.length).sort((a, b) => b[0] - a[0]).slice(0, 30);
  if (!scored.length) { box.innerHTML = `<div class="empty">${esc(U("noResults"))}</div>`; return; }
  box.innerHTML = `<div class="tiny muted" style="padding:8px 16px">${scored.length} ${esc(U("results"))}</div>` + scored.map(([, it]) => `<a class="result" href="${it.href}" data-act="search-go"><div><b>${esc(it.title)}</b><span>${esc(it.sub)}</span></div><span class="chip grey cat">${esc(U("cat." + it.cat))}</span></a>`).join("");
  if (typeof localizeSectionTokens === "function") localizeSectionTokens(box);
}

function stageStatus(stage, course) {
  if (!state.courseId || !course || state.courseId !== course.id) return "";
  const w = state.week;
  if (stage.post) return w >= 16 ? "current" : "upcoming";
  if (stage.weeks[1] < w) return "completed";
  if (stage.weeks[0] <= w && w <= stage.weeks[1]) return "current";
  return "upcoming";
}
function currentStage(pw) { const w = state.week; return pw.stages.find(s => (s.post && w >= 16) || (!s.post && s.weeks[0] <= w && w <= s.weeks[1])) || pw.stages[0]; }
function progressPct(pw) {
  const w = state.week; const stages = pw.stages; let done = 0;
  stages.forEach(s => { if (!s.post && s.weeks[1] < w) done += 1; else if (!s.post && s.weeks[0] <= w && w <= s.weeks[1]) done += (w - s.weeks[0] + 0.5) / (s.weeks[1] - s.weeks[0] + 1); else if (s.post && w >= 16) done += 0.5; });
  return Math.min(100, Math.round(done / stages.length * 100));
}

    const deliv = DATA.deliverables.rows.filter(d => d.v[c.delivCol] > 0).map(d => `<div class="check" style="align-items:center"><span class="sym ${d.v[c.delivCol] === 1 ? "req" : "opt"}">${d.v[c.delivCol] === 1 ? "●" : "○"}</span><span style="flex:1">${d.form ? `<a href="#/documents/forms/${d.form}">${esc(T(d.name))}</a>` : esc(T(d.name))}</span><span class="chip ${d.v[c.delivCol] === 1 ? "success" : "warn"}">${esc(d.v[c.delivCol] === 1 ? U("required") : U("whereApplicable"))}</span></div>`).join("");
    const ver = DATA.assessment.versions[c.sheet]; const dcol = DATA.assessment.defence.columns.find(x => x.id === c.defenceCol);
    body = `<div class="grid g-side">

/* ---------- Roadmap ---------- */
function stageSheet(c, pw, s) {
  const idx = pw.stages.indexOf(s), prev = pw.stages[idx - 1], next = pw.stages[idx + 1];
  const st = stageStatus(s, c);
  const blk = (icon, title, inner, full = false) => `<div class="blk ${full ? "full" : ""}"><h4>${icon}${esc(title)}</h4>${inner}</div>`;
  const notes = s.courseNotes && s.courseNotes[c.id] ? `<div class="callout">${esc(T(s.courseNotes[c.id]))}</div>` : "";
  return `<div class="sheet ph-${s.phase}" id="sheet" tabindex="-1">
    <div class="sheet-head"><div><div class="chips"><span class="chip phase"><i class="dot"></i>${esc(T(DATA.phases[s.phase]))}</span><span class="chip grey num">${esc(U("stageOf")(s.n, pw.stages.length))}</span><span class="chip gold num">${esc(s.post ? U("afterDefence") : U("weekRange")(s.weeks[0], s.weeks[1]))}</span>${st ? `<span class="status ${st}">${esc(U(st))}</span>` : ""}</div><h3>${esc(T(s.title))}</h3>${s.milestone ? `<div class="small"><b>${esc(U("milestone"))}:</b> ${esc(T(s.milestone))}</div>` : ""}</div>
      <div class="btn-row"><a class="btn sm secondary" href="#/journey">${esc(U("nav.journey"))}</a><a class="btn sm secondary" href="#/calendar">${esc(U("nav.calendar"))}</a></div></div>
    <div class="sheet-body">
      ${blk(ICON.target, U("purpose"), `<p style="margin:0">${esc(T(s.purpose))}</p>`, true)}
      ${notes ? `<div class="full">${notes}</div>` : ""}
      ${blk(ICON.list, U("studentActions"), `<ul>${li(s.actions)}</ul>`, true)}
      ${blk(ICON.doc, U("requiredDocs"), `<div class="chips">${s.forms.map(formChip).join("")}</div>`)}
      ${blk(ICON.users, U("responsible"), `<div class="chips">${s.responsible.map(([r, l]) => raciChip(r, l)).join("")}</div><p class="tiny muted" style="margin:8px 0 0">${esc(U("raciKey"))}</p>`)}
      ${blk(ICON.star, U("evaluation"), `<p style="margin:0">${esc(T(s.evaluation))}</p>`)}
      ${blk(ICON.box, U("output"), `<p style="margin:0">${esc(T(s.output))}</p>`)}
      <div class="blk full"><div class="gate-box">${ICON.lock}<div><b>${esc(U("gate"))}:</b> ${esc(T(s.gate))}${next ? ` <span class="muted">→ ${esc(U("nextStage"))}: ${esc(T(next.title))}</span>` : ""}</div></div></div>
      ${blk(ICON.warn, U("pitfalls"), `<ul>${li(s.pitfalls)}</ul>`)}
      ${blk(ICON.link, U("related"), `<div class="chips">${s.related.map(r => `<span class="chip outline">${esc(r)}</span>`).join("")}</div>`)}
    </div>
    <div class="sheet-foot">${prev ? `<a class="btn sm secondary" href="#/roadmap/${c.id}/${prev.id}">← ${esc(U("prevStage"))}: ${esc(T(prev.title))}</a>` : "<span></span>"}${next ? `<a class="btn sm" href="#/roadmap/${c.id}/${next.id}">${esc(U("nextStage"))}: ${esc(T(next.title))} →</a>` : ""}</div></div>`;
}
function viewRoadmap(params) {
  if (params[0] && courseById(params[0]) && params[0] !== state.courseId) { state.courseId = params[0]; const c = courseById(params[0]); state.selLevel = c.level; state.selProg = c.programme; saveState(); }
  const c = courseById(state.courseId);
  let body;
  if (!c) body = `<div class="callout">${esc(U("noCourse"))}</div>`;
  else {
    const pw = pathwayOf(c); const sel = pw.stages.find(s => s.id === params[1]) || (state.week ? currentStage(pw) : pw.stages[0]);
    const weeks = Array.from({ length: 16 }, (_, i) => i + 1);
    const rail = `<div class="rail-wrap"><div class="rail" role="list" aria-label="${esc(U("roadmapTitle"))}">
      <div class="row-lbl" style="grid-row:1;border:0"><span class="t muted small">${esc(U("stage"))} / ${esc(U("week"))}</span></div>
      ${weeks.map(w => `<div class="wk-head ${w === 16 ? "post" : ""} ${state.courseId === c.id && state.week === w ? "now" : ""}" style="grid-row:1;grid-column:${w + 1}"><b class="num">${w === 16 ? "+" : w}</b>${w === 16 ? `<span>${esc(isAr() ? "بعد" : "after")}</span>` : ""}</div>`).join("")}
      ${pw.stages.map((s, i) => { const st = stageStatus(s, c); const a = s.post ? 17 : s.weeks[0] + 1, b = s.post ? 18 : s.weeks[1] + 2; return `<div class="row-lbl ph-${s.phase}" style="grid-row:${i + 2}"><span class="n">${s.n}</span><span class="t">${esc(T(s.title))}</span></div><button class="bar ph-${s.phase} ${st}" role="listitem" style="grid-row:${i + 2};grid-column:${a} / ${b};animation-delay:${i * 40}ms" data-act="go" data-href="#/roadmap/${c.id}/${s.id}" aria-expanded="${sel.id === s.id}" title="${esc(T(s.title))}"><span>${esc(T(s.milestone) || U("weekRange")(s.weeks[0], s.weeks[1]))}</span>${s.milestoneWeek ? `<i class="ms" title="${esc(T(s.milestone))}"></i>` : ""}</button>`; }).join("")}
    </div>
    <div class="rail-legend">${Object.keys(DATA.phases).map(p => `<span class="ph-${p}"><i></i>${esc(T(DATA.phases[p]))}</span>`).join("")}<span><i class="dia"></i>${esc(U("milestone"))}</span></div></div>`;
    const stepper = `<ol class="stepper stepper-wrap card" style="margin-top:14px">${pw.stages.map(s => { const st = stageStatus(s, c); return `<li class="${st}"><span class="st-dot">${st === "completed" ? "✓" : s.n}</span><button class="st-btn" data-act="go" data-href="#/roadmap/${c.id}/${s.id}" aria-expanded="${sel.id === s.id}">${esc(T(s.title))}</button><div class="st-meta"><span class="num">${esc(s.post ? U("afterDefence") : U("weekRange")(s.weeks[0], s.weeks[1]))}</span><span class="chip phase ph-${s.phase}"><i class="dot"></i>${esc(T(DATA.phases[s.phase]))}</span></div></li>`; }).join("")}</ol>`;
    body = `<div class="section-head"><div><h2>${esc(U("pathwayFor"))} ${esc(c.code)} — ${esc(T(c.title))}</h2><p>${esc(T(progOf(c).name))} · ${esc(U("model"))} ${esc(c.model)} · ${esc(T(pw.source))}</p></div><span class="chip grey">${esc(T(pw.name))}</span></div>${rail}${stepper}${stageSheet(c, pw, sel)}`;
  }
  return pageHead("roadmapTitle", "roadmapLead") + `<div class="card" style="margin-bottom:18px">${selectorHtml()}</div>` + body;
}

/* ---------- Roles ---------- */
function viewRoles(params) {
  const openId = params[0];

  const cards = DATA.roles.map(r => {
    const open = openId === r.id; const ridx = DATA.raci.roles.indexOf(r.id);
    const acts = ridx >= 0 ? DATA.raci.rows.filter(rw => ["R", "A"].includes(rw.v[ridx])).map(rw => `<span class="raci-chip"><b class="${rw.v[ridx]}">${rw.v[ridx]}</b>${esc(T(rw.a))}</span>`).join("") : "";

    const st = w < state.week ? "completed" : w === state.week ? "active" : "upcoming";
    let dates = ""; if (start && w < 16) { const d = new Date(start); d.setDate(d.getDate() + (w - 1) * 7); dates = `<div class="tiny muted">${esc(U("weekStarting"))} ${esc(fmtDate(d))} · ${esc(fmtDate(d, "hijri"))}</div>`; } else if (start && w === 16) { const d = new Date(start); d.setDate(d.getDate() + 105); dates = `<div class="tiny muted">${esc(U("from"))} ${esc(fmtDate(d))}</div>`; }
    return `<div class="milestone-row" style="grid-template-columns:96px minmax(0,1fr) auto"><div><div class="w num">${w === 16 ? "+" : w}<small>${esc(w === 16 ? U("afterDefence") : U("week"))}</small></div>${dates}</div><div>${c && stages[0] ? `<div class="tiny muted" style="margin-bottom:4px">${esc(U("stagesThisWeek"))}: <a href="#/roadmap/${c.id}/${stages[0].id}">${stages[0].n}. ${esc(T(stages[0].title))}</a></div>` : ""}${ms.length ? ms.map(m => { const k = c ? `${c.id}|${m.id}` : ""; const done = k && state.done[k]; return `<div style="padding:4px 0"><b>${esc(T(m.title))}</b>${!c ? ` <span class="tiny muted">(${m.pathways.map(p => T(DATA.pathways[p].name)).join(" · ")})</span>` : ""}<div class="chips" style="margin-top:3px">${m.form ? formChip(m.form) : ""}<span class="chip outline">${esc(T(m.who))}</span><span class="ref">${esc(fmtRef(m.ref))}</span>${done ? `<span class="status done">${esc(U("done"))}</span>` : (c && st === "completed" ? `<span class="status overdue">${esc(U("overdue"))}</span>` : "")}</div></div>`; }).join("") : `<span class="tiny muted">${esc(U("noMilestones"))}</span>`}</div><span class="status ${st}">${esc(U(st))}</span></div>`;
  }).join("");
  return pageHead("calTitle", "calLead") + `<div class="card" style="margin-bottom:18px"><div class="grid g3" style="align-items:end"><div class="field"><label for="cal-course">${esc(U("course"))}</label><select id="cal-course" class="select" data-act="cal-course"><option value="all" ${filter === "all" ? "selected" : ""}>${esc(U("allCourses"))}</option>${DATA.courses.map(x => `<option value="${x.id}" ${filter === x.id ? "selected" : ""}>${esc(x.code)} — ${esc(T(x.title))}</option>`).join("")}</select></div><div class="field"><label for="cal-start">${esc(U("startDate"))}</label><input id="cal-start" type="date" class="input" value="${esc(state.startDate)}" data-act="startdate"></div>${weekControl()}</div>${!start ? `<p class="tiny muted" style="margin:10px 0 0">${esc(U("dateNotSet"))}</p>` : `<p class="tiny muted" style="margin:10px 0 0">${esc(U("indicative"))} — ${esc(U("semesterGlanceNote"))}</p>`}</div><div class="card">${rows}</div>`;
}

/* ---------- FAQ ---------- */
function viewFaq(params) {
  const cat = state.ui.faqCat || "all"; const q = (state.ui.faqQ || "").toLowerCase(); const openId = params[0];
  const list = DATA.faq.filter(f => (cat === "all" || f.cat === cat) && (!q || `${T(f.q)} ${T(f.a)} ${f.ref}`.toLowerCase().includes(q)));
  return pageHead("faqTitle", "faqLead") + `<div class="faq-tools"><input type="search" class="input" style="max-width:340px" placeholder="${esc(U("filterFaq"))}" value="${esc(state.ui.faqQ || "")}" data-act="faq-q" aria-label="${esc(U("filterFaq"))}">${segHtml("faqCat", [{ id: "all", label: U("all") }].concat(Object.keys(DATA.faqCats).map(k => ({ id: k, label: T(DATA.faqCats[k]) }))), cat, U("category"))}</div>
    ${list.length ? list.map(f => accHtml(f.id, T(f.q), `<p>${esc(T(f.a))}</p><span class="chip grey">${esc(T(DATA.faqCats[f.cat]))}</span> <span class="ref">${esc(fmtRef(f.ref))}</span>`, openId === f.id)).join("") : `<div class="callout">${esc(U("noResults"))}</div>`}`;
}

    { t: "جهّز نماذجك وتقييمك", d: "افتح «النماذج» للنماذج والمخرجات وهيكل التقرير وقوائم التحقق، و«التقييم» لفهم البطاقتين وتجربة التقييم الذاتي.", ic: ICON.doc },

    { t: "ابحث فوراً", d: "اضغط «بحث» أو المفتاح / في لوحة المفاتيح للوصول السريع لأي مرحلة أو نموذج أو سؤال.", ic: ICON.search }
  ] : [

  const lbl = { title: isAr() ? "العنوان" : "Title", edition: isAr() ? "النسخة / الإصدار" : "Version / edition", supersedes: isAr() ? "يحل محل" : "Supersedes", owner: isAr() ? "الجهة المالكة" : "Owner", preparedBy: isAr() ? "إعداد" : "Prepared by", approvedBy: isAr() ? "جهة الاعتماد" : "Approved by", reviewCycle: isAr() ? "دورة المراجعة" : "Review cycle" };
  return pageHead("helpTitle", "helpLead") +
    `<section class="section"><div class="section-head"><div><h2 style="font-size:22px">${esc(U("steps"))}</h2></div></div>

/* ---------- render & events ---------- */
const RENDER = { home: viewHome, journey: viewJourney, roadmap: viewRoadmap, courses: viewCourses, roles: viewRoles, documents: viewDocuments, assessment: viewAssessment, calendar: viewCalendar, faq: viewFaq, help: viewHelp };
let lastView = "";
function localizeSectionTokens(root) {
  // Replace any remaining "§N.N" in visible text with "Section N" (EN) / "الفصل N" (AR). Text nodes only — never attributes.
  const word = isAr() ? "الفصل " : "Section ";
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const hits = []; let n;
  while ((n = walker.nextNode())) { if (n.nodeValue.indexOf("§") !== -1) hits.push(n); }
  hits.forEach(t => { t.nodeValue = t.nodeValue.replace(/§\s*([\d]+(?:\.[\d]+)*)/g, word + "$1"); });
}
function renderView(opts = {}) {
  const { view, params } = parseHash(); const y = window.scrollY;
  $("#app").innerHTML = RENDER[view](params);
  localizeSectionTokens($("#app"));
  updateNav(view); document.title = `${U("nav." + view)} · ${T(DATA.meta.title)}`;
  $("#nav").classList.remove("open"); $("#scrim").classList.remove("show"); $(".menu-btn")?.setAttribute("aria-expanded", "false");
  if (opts.keepScroll || (view === lastView && opts.sameView !== false)) window.scrollTo({ top: y }); else if (!opts.keepScroll && view !== lastView) window.scrollTo({ top: 0 });
  if (view === "roadmap" && params[1] && lastView === "roadmap") { const sh = $("#sheet"); if (sh) sh.scrollIntoView({ block: "start", behavior: "smooth" }); }
  if (view === "faq" && params[0]) $(`#acc-${params[0]}`)?.scrollIntoView({ block: "center" });
  if (view === "courses" && params[0]) $(`#course-${params[0]}`)?.scrollIntoView({ block: "start" });
  lastView = view;
}
function bind() {
  window.addEventListener("hashchange", () => renderView());
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return; const act = el.dataset.act;
    if (act === "lang") { state.lang = isAr() ? "en" : "ar"; saveState(); INDEX = null; applyLang(); renderChrome(); renderSearchShell(); renderView({ keepScroll: true }); scheduleFitNav(); }
    else if (act === "menu") { const open = $("#nav").classList.toggle("open"); $("#scrim").classList.toggle("show", open); el.setAttribute("aria-expanded", open); }
    else if (act === "search-open") openSearch();
    else if (act === "search-close" || act === "search-go") closeSearch();
    else if (act === "go") { e.preventDefault(); const h = el.dataset.href; if (h === location.hash) renderView({ keepScroll: true }); else go(h); }
    else if (act === "jlock") { state.ui.jOpen = state.ui.jOpen === el.dataset.stage ? "" : el.dataset.stage; renderView({ keepScroll: true }); }
    else if (act === "acc") { const a = el.closest(".acc"); const open = a.classList.toggle("open"); el.setAttribute("aria-expanded", open); }
    else if (act === "seg") { state.ui[el.dataset.group] = el.dataset.val; renderView({ keepScroll: true }); }
    else if (act === "rate") { state.ui.ratings = state.ui.ratings || {}; const k = el.dataset.key, v = Number(el.dataset.val); state.ui.ratings[k] = state.ui.ratings[k] === v ? 0 : v; renderView({ keepScroll: true }); }
    else if (act === "reset-ratings") { state.ui.ratings = {}; renderView({ keepScroll: true }); }
    else if (act === "reset-checks") { const p = el.dataset.prefix; Object.keys(state.checks).forEach(k => { if (k.startsWith(p)) delete state.checks[k]; }); saveState(); renderView({ keepScroll: true }); }
    else if (act === "save-project") { state.project = { title: $("#pj-title").value.trim(), supervisor: $("#pj-sup").value.trim(), team: $("#pj-team").value.trim() }; saveState(); toast(U("saved")); }
    else if (act === "clear-project") { state.project = { title: "", supervisor: "", team: "" }; saveState(); renderView({ keepScroll: true }); }
    else if (act === "form-modal") formModal(formById(el.dataset.form));
    else if (act === "modal-close") closeModal();
    else if (act === "modal-go") closeModal();
  });
  document.addEventListener("change", e => {
    const el = e.target; const act = el.dataset.act;
    if (el.dataset.sel) onSelectorChange(el.dataset.sel, el.value);
    else if (act === "check") { if (el.checked) state.checks[el.dataset.key] = true; else delete state.checks[el.dataset.key]; saveState(); el.closest(".check")?.classList.toggle("done", el.checked); const badge = el.closest(".card")?.querySelector(".section-head .chip"); if (badge) renderView({ keepScroll: true }); }
    else if (act === "done") { if (el.checked) state.done[el.dataset.key] = true; else delete state.done[el.dataset.key]; saveState(); renderView({ keepScroll: true }); }
    else if (act === "week") { state.week = Number(el.value); saveState(); renderView({ keepScroll: true }); }
    else if (act === "startdate") { state.startDate = el.value; saveState(); renderView({ keepScroll: true }); }
    else if (act === "cal-course") { state.ui.calCourse = el.value; renderView({ keepScroll: true }); }
  });
  document.addEventListener("input", e => {
    const el = e.target; const act = el.dataset.act;
    if (act === "search-input") runSearch(el.value);
    else if (act === "week") { const out = el.parentElement.querySelector("output"); if (out) out.textContent = weekLabel(Number(el.value)); }
    else if (act === "faq-q") { state.ui.faqQ = el.value; const pos = el.selectionStart; renderView({ keepScroll: true }); const n = $('[data-act="faq-q"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } } }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeSearch(); closeModal(); $("#nav").classList.remove("open"); $("#scrim").classList.remove("show"); }
    if (e.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
  });
  $("#scrim").addEventListener("click", () => { $("#nav").classList.remove("open"); $("#scrim").classList.remove("show"); });
  $("#search").addEventListener("click", e => { if (e.target === $("#search")) closeSearch(); });
  $("#modal").addEventListener("click", e => { if (e.target === $("#modal")) closeModal(); });
}
function boot() { loadState(); applyLang(); renderChrome(); renderSearchShell(); bind(); if (!location.hash) setHashQuiet("#/home"); renderView(); scheduleFitNav(); window.addEventListener("resize", scheduleFitNav); }
document.addEventListener("DOMContentLoaded", boot);

</script>
</body>
